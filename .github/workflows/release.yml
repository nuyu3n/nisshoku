# Builds 日色 for Windows, Linux and Android and publishes a GitHub release.
#
# Start it by pushing a tag `v<version>` matching the version in
# tauri.conf.json (scripts/bump-version.mjs sets it), or by hand from the
# Actions tab. The release stays a draft until every platform has uploaded,
# then becomes the latest release: the apps' updaters read its latest.json.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  update signatures
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD                         APK signing
#   NISSHOKU_GDRIVE_CLIENT_ID, NISSHOKU_GDRIVE_CLIENT_SECRET        Google Drive client (optional)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0); created on the current commit if missing"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            # The oldest supported Ubuntu: the AppImage runs on distributions at least as new.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install web dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NISSHOKU_GDRIVE_CLIENT_ID: ${{ secrets.NISSHOKU_GDRIVE_CLIENT_ID }}
          NISSHOKU_GDRIVE_CLIENT_SECRET: ${{ secrets.NISSHOKU_GDRIVE_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ env.TAG }}
          releaseName: "日色 __VERSION__"
          releaseBody: |
            ## ダウンロード
            - **Windows**: `Nisshoku_*_x64-setup.exe`（管理者権限なしで入ります）
            - **Linux**: `.AppImage`（実行権限を付けて起動）、`.deb`（Ubuntu・Debian）、`.rpm`（Fedora・openSUSE）
            - **Android**: `nisshoku_*_android.apk`

            インストール済みのアプリは、設定 → アップデート から更新できます。
          releaseDraft: true
          prerelease: ${{ contains(env.TAG, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # Its default also installs `tools`, which Google no longer
          # publishes (sdkmanager: "Failed to find package 'tools'").
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install web dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Signing key
        working-directory: apps/desktop/src-tauri/gen/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the APK
        working-directory: apps/desktop
        env:
          NISSHOKU_GDRIVE_CLIENT_ID: ${{ secrets.NISSHOKU_GDRIVE_CLIENT_ID }}
          NISSHOKU_GDRIVE_CLIENT_SECRET: ${{ secrets.NISSHOKU_GDRIVE_CLIENT_SECRET }}
        run: pnpm tauri android build --apk

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          apk="nisshoku_${version}_android.apk"
          cp apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          # The desktop jobs create the draft; wait for it if this job is first.
          for i in $(seq 1 60); do gh release view "$TAG" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" "$apk" --clobber

  publish:
    name: Publish
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest=${{ contains(env.TAG, '-') && 'false' || 'true' }}
