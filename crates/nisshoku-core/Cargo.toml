[package]
name = "nisshoku-core"
version.workspace = true
edition.workspace = true
description = "Data model, Joplin-compatible item serialization and local SQLite storage"

[dependencies]
chrono = "0.4.45"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
