[package]
name = "nisshoku-engine"
version.workspace = true
edition.workspace = true
description = "日色 — the app's commands over the data model and sync engine, for every front end (the Tauri window, the native Android app)"

[dependencies]
chrono = "0.4.45"
encoding_rs = "0.8"
nisshoku-core = { path = "../nisshoku-core" }
nisshoku-sync = { path = "../nisshoku-sync" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# On Linux: the Secret Service (GNOME Keyring, KWallet), which keeps secrets
# across restarts, over D-Bus in pure Rust.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-async-persistent", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3.27.0"
