<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 月食: the moon in Earth's larger shadow, coppery, with
       the last sunlit rim at the top left. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2e2540"/>
      <stop offset="1" stop-color="#16121e"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="512" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0.66" stop-color="#e2733a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#e2733a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="umbra" cx="770" cy="770" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0.42" stop-color="#5e1f10"/>
      <stop offset="0.8" stop-color="#ab3f1a"/>
      <stop offset="1" stop-color="#e98443"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="512" cy="512" r="290"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sky)"/>
  <circle cx="232" cy="270" r="7" fill="#f4e6cf" opacity="0.8"/>
  <circle cx="800" cy="208" r="5" fill="#f4e6cf" opacity="0.6"/>
  <circle cx="842" cy="790" r="6" fill="#f4e6cf" opacity="0.45"/>
  <circle cx="512" cy="512" r="430" fill="url(#glow)"/>
  <g clip-path="url(#disc)">
    <!-- sunlit rim, penumbra, umbra -->
    <circle cx="512" cy="512" r="290" fill="#f8ecd6"/>
    <circle cx="770" cy="770" r="542" fill="#eeac78"/>
    <circle cx="770" cy="770" r="520" fill="url(#umbra)"/>
  </g>
</svg>
