[package]
name = "nisshoku-app"
version.workspace = true
edition.workspace = true
description = "日食 — a writing app"

[lib]
name = "nisshoku_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
encoding_rs = "0.8"
nisshoku-core = { path = "../../../crates/nisshoku-core" }
nisshoku-sync = { path = "../../../crates/nisshoku-sync" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1.44"
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# On Linux: the Secret Service (GNOME Keyring, KWallet), which keeps secrets
# across restarts, over D-Bus in pure Rust.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-async-persistent", "async-io", "crypto-rust"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# reqwest verifies certificates with Android's trust manager, which needs the
# JVM handed to it at start-up.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"
